services:

  # =========================
  # KAFKA - INGESTION STREAMING
  # =========================
  kafka:
    image: apache/kafka:4.1.2
    container_name: nid_kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 768m
    restart: unless-stopped

  # =========================
  # HDFS - NAMENODE
  # =========================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: nid_namenode
    hostname: namenode
    ports:
      - "9870:9870"
    environment:
      CLUSTER_NAME: intrusion-detection
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - namenode_data:/hadoop/dfs/name
    mem_limit: 512m
    restart: unless-stopped

  # =========================
  # HDFS - DATANODE 1
  # =========================
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: nid_datanode1
    hostname: datanode1
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    mem_limit: 512m
    restart: unless-stopped

  # =========================
  # HDFS - DATANODE 2
  # =========================
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: nid_datanode2
    hostname: datanode2
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - datanode2_data:/hadoop/dfs/data
    mem_limit: 512m
    restart: unless-stopped

  # =========================
  # SPARK - MASTER
  # =========================
  spark-master:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: nid_spark_master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 768m
    restart: unless-stopped

  # =========================
  # SPARK - WORKER 1
  # =========================
  spark-worker1:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: nid_spark_worker1
    hostname: spark-worker1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 1
      --memory 512m
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 768m
    restart: unless-stopped

  # =========================
  # SPARK - WORKER 2
  # =========================
  spark-worker2:
    image: apache/spark:3.5.7-scala2.12-java17-python3-ubuntu
    container_name: nid_spark_worker2
    hostname: spark-worker2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 1
      --memory 512m
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 768m
    restart: unless-stopped

  # =========================
  # POSTGRESQL - RESULTS
  # =========================
  postgres:
    image: postgres:16
    container_name: nid_postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: intrusion_db
      POSTGRES_USER: intrusion_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    restart: unless-stopped

# =========================
# PERSISTENT VOLUMES
# =========================
volumes:
  kafka_data:
  namenode_data:
  datanode1_data:
  datanode2_data:
  postgres_data: