# infra/spark-defaults.conf : monté dans le conteneur spark-client
# (/opt/spark/conf/spark-defaults.conf). Valable pour tous les spark-submit.

spark.master                      spark://spark-master:7077
spark.submit.deployMode           client

# Les workers n'offrent que 768 Mo : l'executor doit rester en dessous.
spark.driver.memory               512m
spark.executor.memory             512m
spark.executor.cores              1
spark.sql.shuffle.partitions      8

# Le driver tourne dans spark-client : les executors doivent pouvoir le joindre.
spark.driver.host                 spark-client
spark.driver.bindAddress          0.0.0.0

# HDFS : 2 DataNodes => réplication 2 pour tout ce que Spark écrit.
spark.hadoop.dfs.replication      2
spark.hadoop.fs.defaultFS         hdfs://namenode:9000

# Connecteurs téléchargés au premier lancement (internet requis), mis en cache dans le volume ivy_cache.
spark.jars.ivy                    /tmp/ivy
spark.jars.packages               org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7,org.postgresql:postgresql:42.7.4